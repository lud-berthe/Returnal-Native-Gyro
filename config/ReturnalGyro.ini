; Returnal Native Gyro - values apply live unless marked restart required.
; Booleans: 0 Off, 1 On. Manual calibration: F9 while the controller is stationary.
[ReturnalGyro]

; Enable native angular gyro camera input.
GyroEnabled = 1

; 0 Auto; 1 Native. Both require a native sensor; never generates mouse input.
GyroInputMode = 0

; 0 Auto (Steam Input, Sony HID, SDL); 1 SDL sensors; 2 Steam Input; 3 Sony passive HID only. Restart required. Disable Steam layout gyro output when using native gyro.
SensorBackend = 0

; Motion-device index: Steam gamepad slot/handle order, direct devices by path. Restart to change.
DeviceIndex = 0

; Horizontal natural sensitivity: 1 means one camera degree per controller degree.
SensitivityX = 2.5

; Vertical natural sensitivity, independent of horizontal sensitivity.
SensitivityY = 2.5

; Legacy key, ignored. X and Y now remain independent.
LinkXY = 0

; Additional multiplier in verified aiming state.
AimMultiplier = 1

; Additional multiplier in verified Alt-Fire state, replacing AimMultiplier.
AltFireMultiplier = 1

; 0 Player Space; 1 Local Yaw; 2 Local Roll; 3 World Space.
GyroSpace = 0

; 0 Always On (hold common button to disable); 1 Aim Only; 2 Hip-fire Only; 3 Hold Enable; 5 Toggle. Legacy 4 migrates to 0.
ActivationMode = 1

; 0 None; 1 L1; 2 R1; 3 L3; 4 R3; 5 Touchpad contact; 7 Circle/East; 10 Square/West; 11 Triangle/North; 12/13 left/right trackpad; 14/15/16 left/right/either thumbstick touch; 17/18/19 left/right/either grip touch; 20/21 L4/R4; 22/23 L5/R5; 24 both pads; 25 both stick sensors; 26 both grip sensors; 27/28 either/both stick clicks. Game actions use taps shorter than 200 ms; gyro responds immediately. Legacy IDs 6/8/9 reset to None.
ActivationButton = 0

; Gyro physical button: 0 Off; 1 L1; 2 R1; 3 L3; 4 R3; 7 East; 10 West; 11 North; 20/21 L4/R4; 22/23 L5/R5.
GyroButton = 0

; Gyro trackpad contact: 0 Off; 12 Left; 13 Right; 5 Either or single touchpad; 24 Both.
GyroTouchpad = 0

; Gyro thumbstick contact: 0 Off; 14 Left; 15 Right; 16 Either; 25 Both.
GyroStickSensor = 0

; Gyro grip contact: 0 Off; 17 Left; 18 Right; 19 Either; 26 Both.
GyroGripSensor = 0

; Gyro stick deflection: 0 Off; 3 Left; 4 Right; 27 Either; 28 Both. Enabled families combine with OR.
GyroStick = 0

; Legacy input alias. The shared ActivationButton now handles activation and ratcheting.
RatchetButton = 0

; Suspend gyro while right-stick magnitude exceeds RightStickThreshold.
DisableWhileRightStick = 0

; Normalized deflection threshold for either stick in the GyroStick family.
RightStickThreshold = 0.2

; Invert gyro horizontal direction independently of game controls.
InvertX = 0

; Invert gyro vertical direction independently of game controls.
InvertY = 0

; Opt into GamepadMotionHelpers hybrid stillness/sensor-fusion calibration; off preserves slow tracking.
AutomaticCalibration = 0

; Manual still-surface calibration duration. Movement restarts collection.
CalibrationSeconds = 3

; Optional continuous precision threshold in deg/s: scales input by min(speed/threshold,1), not a deadzone.
TighteningDps = 0

; 0 Off; 1 Low; 2 Medium; 3 High. Presets smooth only slow motion.
Smoothing = 0

; Fully smooth below half this speed; fully immediate at this speed (deg/s).
SmoothingThresholdDps = 2

; Time window for low-speed smoothing, in seconds.
SmoothingSeconds = 0.039999999

; Optional hard angular deadzone. Zero preserves arbitrarily small motion.
CutoffDps = 0

; 0 Off; 1 Low (up to 1.5x); 2 Medium (2x); 3 High (3x). Multiplies each axis independently.
Acceleration = 0

; Natural sensitivity below AccelerationStartDps.
MinSensitivity = 1

; Natural sensitivity at or above AccelerationEndDps.
MaxSensitivity = 1

; Controller rotation speed where acceleration begins (deg/s).
AccelerationStartDps = 0

; Controller rotation speed where acceleration reaches MaxSensitivity (deg/s).
AccelerationEndDps = 75

; Enable the verified mouse-motion input-method transition guard.
MixedInput = 1

; Mouse motion still reaches camera/UI, but does not change presentation during mixed input.
IgnoreMouseMotion = 1

; 0 Automatic except ignored mouse movement; 1 Controller; 2 Keyboard/Mouse.
HudMode = 0

; Log lifecycle, binding validation, controller and calibration changes.
DiagnosticLogging = 1

; Show compact sensor and camera diagnostics in the configuration panel.
DebugOverlay = 0

; Record per-sample sensor diagnostics; large logs and higher overhead, debugging only.
VerboseSamples = 0

; Settings text/control scale: 0 Auto (DPI and resolution), 1 to 3 explicit scale. Auto uses 2x on 4K.
UIScale = 0

; Configuration schema version; old activation/ratchet settings are migrated on load.
ConfigVersion = 3

; 0 Off; 1 Hip-fire only (not aim or Alt-Fire); 2 On. Replaces normal right-stick camera input during gameplay.
FlickStick = 0

; Initial flick rotation duration in milliseconds; 0 is instant. Independent from continuous stick rotation.
FlickSpinDurationMs = 150
